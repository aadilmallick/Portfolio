    <link rel="shortcut icon" type="image/x-icon" href="faviconaadil.ico" />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.6.1/css/all.css"
      integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dosis:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css" />

    <!-- LinkedIn Badge -->
    <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>

    <!-- js -->
    <script src="./js/components/PageLoader.js" type="module"></script>
    <script src="./js/components/navbar.js" type="module"></script>
  </head>
  <body>
    <page-loader data-fade-out-time="500"></page-loader>

    <nav-bar></nav-bar>

    <section id="contact-a" class="text-center">
      <div class="container">
        <h2 class="section-title">Contact Me</h2>
        <div class="divider-sm"></div>
        <p class="lead">Here is how you can reach me.</p>
        <form method="POST" data-netlify="true" data-netlify-recaptcha="true">
          <div class="text-fields">
            <input
              type="text"
              class="text-input name-input"
              placeholder="Name"
              name="name"
            />
            <input
              type="text"
              class="text-input subject-input"
              placeholder="Subject"
              name="subject"
            />
            <input
              type="email"
              class="text-input email-input"
              placeholder="Email"
              name="email"
              required
            />
            <textarea
              class="text-input message-input"
              placeholder="Send me a message..."
              name="message"
              required
            ></textarea>
            <div>
              <div data-netlify-recaptcha="true"></div>
            </div>
          </div>
          <button id="submit" type="submit" class="btn btn-dark">Submit</button>
        </form>
      </div>
    </section>

    <section id="contact-b" class="text-center">
      <div class="container">
        <div class="contact-info">
          <div>
            <i class="fas fa-envelope fa-2x"></i>
            <h3>email</h3>
            <p>aadiltj.mallick@gmail.com</p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact-c" class="text-center" t>
      <div class="container">
        <h1>I'm ready to build</h1>
      </div>
    </section>

    <div class="linkedin-badge-container">
      <div class="badge-base LI-profile-badge" data-locale="en_US" data-size="medium" data-theme="light" data-type="VERTICAL" data-vanity="aadil-mallick" data-version="v1"><a class="badge-base__link LI-simple-link" href="https://www.linkedin.com/in/aadil-mallick?trk=profile-badge">Aadil Mallick</a></div>
      <a class="scholar-card" href="https://scholar.google.com/citations?user=HI9RK-gAAAAJ&hl=en" target="_blank" rel="noopener noreferrer">
        <div class="scholar-header">
          <i class="fas fa-graduation-cap scholar-icon"></i>
          <span class="scholar-title">Google Scholar</span>
        </div>
        <div class="scholar-body">
          <div class="scholar-avatar">
            <i class="fas fa-user-academic">M</i>
          </div>
          <div class="scholar-name">Aadil Mallick</div>
          <div class="scholar-institution">W&M Computer Science & Mathematics</div>
        </div>
        <div class="scholar-footer">
          View Publications
        </div>
      </a>
    </div>
    <footer id="main-footer">
      <div class="footer-content container">
        <p>Copyright &copy; 2022. All Rights Reserved</p>
        <div class="social">
          <a href="https://github.com/aadilmallick" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/in/aadil-mallick/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://medium.com/@waadlingaadil" target="_blank" rel="noopener noreferrer" aria-label="Medium">
            <i class="fab fa-medium-m"></i>
          </a>
        </div>
      </div>
    </footer>

    <script text="text/javascript" defer>
      document.querySelector("form").addEventListener(
        "submit",
        function (e) {
          e.preventDefault();
          const linkElement = document.createElement("a");
          linkElement.href = `mailto:aadiltj.mallick@gmail.com?subject=${e.target.subject.value}&body=${e.target.message.value}`;
          linkElement.click();
          setTimeout(() => {
            document.querySelector("button[type='submit']").click();
          }, 50);
        },
        {
          once: true,
        }
      );
    </script>
  </body>
</html>
